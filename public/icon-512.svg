<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <g transform="translate(106, 106)">
    <!-- Circuit lines & recycle loop -->
    <circle cx="150" cy="150" r="130" fill="none" stroke="#059669" stroke-width="12" stroke-dasharray="24 12" />
    <!-- Recycle arrows with chip symbol -->
    <path d="M150,40 L195,110 L160,110 L160,190 L140,190 L140,110 L105,110 Z" fill="url(#circGrad)" />
    <path d="M150,260 L105,190 L140,190 L140,110 L160,110 L160,190 L195,190 Z" fill="#6ee7b7" transform="rotate(120 150 150)" />
    <path d="M150,260 L105,190 L140,190 L140,110 L160,110 L160,190 L195,190 Z" fill="#10b981" transform="rotate(240 150 150)" />
    <!-- Center Microchip -->
    <rect x="115" y="115" width="70" height="70" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="6" />
    <circle cx="138" cy="138" r="6" fill="#34d399" />
    <circle cx="162" cy="138" r="6" fill="#34d399" />
    <circle cx="150" cy="162" r="6" fill="#34d399" />
  </g>
</svg>
